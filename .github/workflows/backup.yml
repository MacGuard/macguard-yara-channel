name: Encrypted backup (D1, age, Sigstore, B2 + Scaleway + R2)

# One GitHub environment per provider, one job per environment (Actions allows one environment per job):
#   fetch-*   (archive-<p>-read)   read the newest signed statement the provider holds; only PUBLIC statements leave the job
#   export    (macguard-backup-production) export D1, verify, encrypt with age to the PUBLIC recipient, sign ANCHOR/CHECKPOINT with Sigstore keyless (this workflow's own OIDC identity); no storage credential
#   write-*   (archive-<p>-write)  copy the encrypted package, write-once, nothing is ever overwritten or deleted
#   read-*    (archive-<p>-read)   prove the READ credential cannot write, download the copy from the provider, verify it as a clean machine would
#   redundancy                      aggregate: "three verified copies" only if all three providers verified
# What jobs exchange: age CIPHERTEXT and PUBLIC signed statements, as artifacts kept one day. This repository is public, so those artifacts are readable by anyone with a GitHub login: the SQL is never in them,
# the ciphertext is encrypted to a recipient whose private identity is NOT in GitHub, and no secret, credential or output carries data between jobs. The age identity is never available to this workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'backup = the real backup; selftest = sign a SYNTHETIC statement with this workflow identity, no credentials, no copy (proves the keyless path)'
        type: choice
        options: [backup, selftest]
        default: backup
  schedule:
    - cron: '23 3 * * *'

permissions: {}

concurrency:
  group: macguard-backup
  cancel-in-progress: false

env:
  WORK: ${{ github.workspace }}/.backup-work

jobs:
  fetch:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'backup')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [b2, scaleway, r2]
    environment: archive-${{ matrix.provider }}-read
    env:
      MG_ARCHIVE_PROVIDER: ${{ matrix.provider }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The environment describes the bucket the repository expects
        env:
          P: ${{ matrix.provider }}
          V_BUCKET: ${{ vars.ARCHIVE_BUCKET }}
          V_ENDPOINT: ${{ vars.ARCHIVE_ENDPOINT }}
        run: |
          set -eu
          [ "$V_BUCKET" = "$(jq -r ".destinations.$P.bucket" gateway/environments/backup-destinations.json)" ] || { echo "::error::ARCHIVE_BUCKET of the environment is not the bucket in backup-destinations.json"; exit 1; }
          [ "$V_ENDPOINT" = "$(jq -r ".destinations.$P.endpoint" gateway/environments/backup-destinations.json)" ] || { echo "::error::ARCHIVE_ENDPOINT of the environment is not the endpoint in backup-destinations.json"; exit 1; }
      - name: Newest signed statement held by this provider (statement only; the ciphertext is left where it is)
        run: |
          set -eu
          T=gateway/environments/backup-trust.json
          mkdir -p "$WORK/prev"
          if node gateway/tools/backup_objstore.mjs fetch-previous --only '${{ matrix.provider }}' --statement-only --trust-key "$(jq -r .ed25519.public_key $T)" --sigstore-identity "$(jq -r .sigstore.identity $T)" --sigstore-repo "$(jq -r .sigstore.repository $T)" --ed25519-max-sequence "$(jq -r .ed25519.max_sequence $T)" --out "$WORK/prev" > "$WORK/fetched.json"; then jq -c . "$WORK/fetched.json"; else echo "This provider holds no verified signed backup yet."; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prev-${{ matrix.provider }}
          path: .backup-work/prev
          retention-days: 1
          if-no-files-found: ignore

  export:
    needs: fetch
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'backup')
    runs-on: ubuntu-24.04
    environment: macguard-backup-production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # keyless Sigstore signing with the workflow identity
    outputs:
      stamp: ${{ steps.sign.outputs.stamp }}
      sequence: ${{ steps.sign.outputs.sequence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Trust anchors
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -eu
          T=gateway/environments/backup-trust.json
          IDENT="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/backup.yml@${GITHUB_REF}"
          [ "$(jq -r .sigstore.identity $T)" = "$IDENT" ] || { echo "::error::the pinned Sigstore identity in $T is not this workflow's identity"; exit 1; }
          [ "$HAS_CF" = true ] || { echo "::error::BLOCKED: no CLOUDFLARE_API_TOKEN is available to the export job (environment macguard-backup-production or repository)"; exit 1; }
          {
            echo "ED_PUB=$(jq -r .ed25519.public_key $T)"
            echo "ED_MAX=$(jq -r .ed25519.max_sequence $T)"
            echo "SIG_ID=$IDENT"
            echo "SIG_REPO=$(jq -r .sigstore.repository $T)"
            echo "RECIPIENT=$(jq -r .age_recipient $T)"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: prev-*
          path: ${{ github.workspace }}/.backup-work/fetched
      - name: Export D1, verify in an isolated restore, encrypt with age
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p "$WORK/backups" && chmod 700 "$WORK/backups"
          node gateway/tools/d1_backup.mjs --env gateway/environments/production.wrangler.toml --root "$WORK/backups" --age-recipient "$RECIPIENT"
      - name: Choose the predecessor among the statements the providers hold (and the repository's genesis), verified with the pinned policy
        id: prev
        run: |
          set -eu
          CANDS=$( { find "$WORK/fetched" -mindepth 2 -maxdepth 2 -type d; find gateway/environments/backup-genesis -mindepth 1 -maxdepth 1 -type d; } | sort | paste -sd, -)
          node gateway/tools/backup_anchor.mjs choose-previous --candidates "$CANDS" --out "$WORK/predecessor" --public-key "$ED_PUB" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX" | tee "$RUNNER_TEMP/prev.json"
          echo "stamp=$(jq -r .stamp "$RUNNER_TEMP/prev.json")" >> "$GITHUB_OUTPUT"
      - name: Sign ANCHOR.json and CHECKPOINT.json with Sigstore keyless (nothing is kept unless it verifies for the pinned identity)
        id: sign
        run: |
          set -eu
          PREV='${{ steps.prev.outputs.stamp }}'
          NEW=$(find "$WORK/backups" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -E '^[0-9]{8}T[0-9]{6}Z$' | sort | tail -1)
          [ -n "$NEW" ] && [ "$NEW" \> "$PREV" ] || { echo "::error::the new backup is not newer than the predecessor"; exit 1; }
          node gateway/tools/backup_anchor.mjs sign-sigstore --dir "$WORK/backups/$NEW" --previous "$WORK/predecessor/$PREV" --public-key "$ED_PUB" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX" | tee "$RUNNER_TEMP/signed.json"
          node gateway/tools/backup_anchor.mjs checkpoint-sigstore --dir "$WORK/backups/$NEW" --out "$WORK/package/checkpoint" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX"
          node gateway/tools/backup_anchor.mjs verify --dir "$WORK/backups/$NEW" --public-key "$ED_PUB" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX"
          node gateway/tools/backup_anchor.mjs verify-checkpoint --dir "$WORK/package/checkpoint" --public-key "$ED_PUB" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX"
          mkdir -p "$WORK/package/backups" && cp -R "$WORK/backups/$NEW" "$WORK/package/backups/$NEW"
          echo "stamp=$NEW" >> "$GITHUB_OUTPUT"; echo "sequence=$(jq -r .sequence "$RUNNER_TEMP/signed.json")" >> "$GITHUB_OUTPUT"
      - name: The package holds ciphertext and public statements only
        run: |
          set -eu
          D="$WORK/package/backups/${{ steps.sign.outputs.stamp }}"
          [ "$(head -c 21 "$D/d1-export.sql.age")" = "age-encryption.org/v1" ] || { echo "::error::the stored file is not age ciphertext"; exit 1; }
          if find "$WORK/package" -type f \( -name '*.sql' -o -name '*.sqlite*' -o -name '*.db' -o -name '*.toml' \) | grep -q .; then echo "::error::plaintext or configuration found in the package"; exit 1; fi
          find "$WORK/package" -type f | sort | sed "s#^$WORK/package/##"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: .backup-work/package
          retention-days: 1
          if-no-files-found: error
      - name: Summary
        run: |
          { echo "### Backup ${{ steps.sign.outputs.stamp }} (sequence ${{ steps.sign.outputs.sequence }})"; echo; echo '```json'; cat "$RUNNER_TEMP/signed.json"; echo '```'; echo "Signed by \`$SIG_ID\`."; } >> "$GITHUB_STEP_SUMMARY"

  write:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [b2, scaleway, r2]
    environment: archive-${{ matrix.provider }}-write
    env:
      MG_ARCHIVE_PROVIDER: ${{ matrix.provider }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ github.workspace }}/.backup-work/package
      - name: The environment describes the bucket the repository expects
        env:
          P: ${{ matrix.provider }}
          V_BUCKET: ${{ vars.ARCHIVE_BUCKET }}
        run: |
          set -eu
          [ "$V_BUCKET" = "$(jq -r ".destinations.$P.bucket" gateway/environments/backup-destinations.json)" ] || { echo "::error::ARCHIVE_BUCKET of the environment is not the bucket in backup-destinations.json"; exit 1; }
      - name: Plan, then copy write-once (an existing key with other bytes is a conflict, never overwritten)
        run: |
          node gateway/tools/backup_objstore.mjs plan --root "$WORK/package/backups"
          node gateway/tools/backup_objstore.mjs sync --apply --only '${{ matrix.provider }}' --root "$WORK/package/backups"
      - name: The statement and checkpoint travel with the copy
        run: echo "uploaded ${{ needs.export.outputs.stamp }} to ${{ matrix.provider }}" >> "$GITHUB_STEP_SUMMARY"

  read:
    needs: [export, write]
    if: ${{ always() && needs.export.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [b2, scaleway, r2]
    environment: archive-${{ matrix.provider }}-read
    env:
      MG_ARCHIVE_PROVIDER: ${{ matrix.provider }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ github.workspace }}/.backup-work/package
      - name: The READ credential reads and cannot write
        run: node gateway/tools/backup_objstore.mjs probe-readonly --only '${{ matrix.provider }}'
      - name: Download the newest backup from this provider and verify it as a clean machine would
        run: |
          set -eu
          T=gateway/environments/backup-trust.json
          ED_PUB=$(jq -r .ed25519.public_key $T); ED_MAX=$(jq -r .ed25519.max_sequence $T); SIG_ID=$(jq -r .sigstore.identity $T); SIG_REPO=$(jq -r .sigstore.repository $T)
          STAMP='${{ needs.export.outputs.stamp }}'
          mkdir -p "$WORK/dl"
          node gateway/tools/backup_objstore.mjs fetch-previous --only '${{ matrix.provider }}' --trust-key "$ED_PUB" --sigstore-identity "$SIG_ID" --sigstore-repo "$SIG_REPO" --ed25519-max-sequence "$ED_MAX" --out "$WORK/dl" | tee "$WORK/fetched.json"
          [ "$(jq -r .stamp "$WORK/fetched.json")" = "$STAMP" ] || { echo "::error::${{ matrix.provider }} serves $(jq -r .stamp "$WORK/fetched.json"), not the backup just made (lag or rollback)"; exit 1; }
          for f in d1-export.sql.age manifest.json SHA256SUMS ANCHOR.json ANCHOR.json.sigstore.json; do cmp "$WORK/dl/$STAMP/$f" "$WORK/package/backups/$STAMP/$f" || { echo "::error::$f differs from the package that was uploaded"; exit 1; }; done
          MG_CHECKPOINT_DIRS="$WORK/package/checkpoint" MG_SIGSTORE_IDENTITY="$SIG_ID" MG_SIGSTORE_REPO="$SIG_REPO" MG_ED25519_MAX_SEQUENCE="$ED_MAX" sh gateway/tools/recover_verify.sh "$WORK/dl/$STAMP" "$ED_PUB" "$(jq -r .sequence "$WORK/fetched.json")"
          sha256sum "$WORK/dl/$STAMP"/* | sed "s#$WORK/dl/##" > "$WORK/dl/$STAMP.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-${{ matrix.provider }}
          path: .backup-work/dl
          retention-days: 1
          if-no-files-found: error

  redundancy:
    needs: [export, write, read]
    if: ${{ always() && needs.export.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Copies verified, per provider (no claim of three copies unless all three verified)
        env:
          WRITE: ${{ needs.write.result }}
          READ: ${{ needs.read.result }}
          STAMP: ${{ needs.export.outputs.stamp }}
        run: |
          {
            echo "### Redundancy for $STAMP"
            echo "| step | result |"; echo "|---|---|"
            echo "| write (b2, scaleway, r2) | $WRITE |"; echo "| read-back and clean verification (b2, scaleway, r2) | $READ |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$WRITE" = success ] && [ "$READ" = success ]; then echo "THREE VERIFIED COPIES of $STAMP" | tee -a "$GITHUB_STEP_SUMMARY"; else echo "::error::NOT three verified copies: write=$WRITE read=$READ (see the per-provider jobs)"; exit 1; fi

  selftest:
    # Proves the keyless path with this very identity and no credentials: a SYNTHETIC statement (stamp 20000101T000000Z, files of fixed text) is signed, verified and published as an artifact. It touches no provider.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'selftest'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign a synthetic anchor and checkpoint with the workflow identity and verify them
        run: node gateway/tools/backup_selftest.mjs "$RUNNER_TEMP/selftest" gateway/environments/backup-trust.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigstore-selftest
          path: ${{ runner.temp }}/selftest/public/
          retention-days: 30
          if-no-files-found: error
