name: Sign and publish approved candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful daily review workflow run ID'
        required: true
permissions:
  contents: write
  actions: write    # dispatch the site deployment
  id-token: write   # keyless Sigstore signing with the workflow identity
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  # No approval is asked for a candidate that would republish what is already released.
  precheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.same.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: dist/
      - id: same
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --dir previous --pattern manifest.json || echo 'No previous release'
          python3 scripts/changes.py --dist dist --previous previous/manifest.json --out /tmp/changes.json > /tmp/out.txt
          if grep -q 'changed=false' /tmp/out.txt; then echo 'skip=true' >> "$GITHUB_OUTPUT"; echo 'Candidate is identical to the latest release; nothing to publish.'; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # Human approval stays on until the autonomous path has been demonstrated end to end. Setting the repository variable
    # AUTO_PUBLISH=true (a deliberate, logged repository change) switches to an environment without required reviewers;
    # branch protection, the OIDC identity and every technical check below are identical in both modes.
    environment: ${{ vars.AUTO_PUBLISH == 'true' && 'stable-signing-auto' || 'stable-signing' }}
    timeout-minutes: 20
    env:
      QUARANTINE_URL: ${{ vars.QUARANTINE_URL }}
      RUN_ID: ${{ inputs.candidate_run_id }}
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Name the release
        run: echo "TAG=rules-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_run.py
      - name: Re-verify the final set before signing (engine, classification, dynamic evidence)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq yara
          python3 scripts/rulecheck.py --dist dist --out /tmp/classification.json
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          import tlog
          cls = json.load(open('/tmp/classification.json')); cand = json.load(open('dist/candidate.json')); dyn = json.load(open('dist/dynamic.json'))
          bad = [f['path'] for f in cls['files'] if f['state'] != 'VALIDATED']
          assert not bad, f'{len(bad)} files do not pass the static checks again: {bad[:3]}'
          root = tlog.rules_root(cand['files'])
          assert dyn['set_root'] == root, 'the dynamic evidence belongs to a different set'
          assert dyn['verdict'] in ('ok', 'no-baseline'), f"dynamic verdict {dyn['verdict']}"
          assert dyn['canaries_detected'] == dyn['canaries_expected'], 'detection canaries were not all detected'
          print('final set re-verified:', len(cand['files']), 'files, rules_root', root[:16], 'dynamic', dyn['verdict'], 'on', dyn['platform'])
          PY
      - name: Verify the existing log before extending it
        run: python3 scripts/tlog.py verify --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY"
      - name: Record approval and sign the log head
        run: |
          python3 scripts/tlog.py event --level INFO --code release.approved --run-id "$RUN_ID" \
            --message "Candidate from review run $RUN_ID was approved for signing in workflow run ${{ github.run_id }}." --detail "run_url=$RUN_URL"
          python3 scripts/tlog.py checkpoint
          LATEST="$(ls logs/checkpoints/*.txt | sort | tail -1)"
          cosign sign-blob --yes --bundle "${LATEST%.txt}.sigstore.json" "$LATEST"
          cp "${LATEST%.txt}.sigstore.json" logs/checkpoint.sigstore.json
          python3 scripts/tlog.py render
          python3 scripts/tlog.py verify --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY"
      - name: Write and sign the manifest
        run: |
          python3 scripts/seal.py
          cosign sign-blob --yes --bundle dist/manifest.sigstore.json dist/manifest.json
          python3 scripts/tlog.py release-proof --run-id "$RUN_ID" --manifest dist/manifest.json --out dist/inclusion-proof.json
      - name: Archive signed release
        run: tar -czf rules-release.tar.gz -C dist rules manifest.json
      - name: Release metadata, changelog and consistency proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --dir previous --pattern manifest.json || echo 'No previous release'
          cp logs/checkpoint.txt dist/checkpoint.txt; cp logs/checkpoint.sigstore.json dist/checkpoint.sigstore.json
          python3 scripts/release_meta.py --dist dist --tarball rules-release.tar.gz --tag "$TAG" --run-url "$RUN_URL" --out release-meta --previous previous/manifest.json
      - name: Check the artifacts before anything becomes public
        run: |
          mkdir verify && tar -xzf rules-release.tar.gz -C verify
          cp dist/manifest.json dist/manifest.sigstore.json dist/inclusion-proof.json verify/ && mkdir verify/logs && cp logs/checkpoint.txt logs/checkpoint.sigstore.json verify/logs/
          python3 scripts/verify_release.py verify --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import json
          m = json.load(open('verify/manifest.json')); r = json.load(open('release-meta/release.json'))
          assert r['files'] == len(m['files']) == m['stats']['files'], 'file count mismatch'
          assert r['rules_root'] == m['rules_root']
          print('release metadata consistent:', r['files'], 'files,', r['yara_rules'], 'rules')
          PY
      - name: Publish release (draft first, public only when every asset is attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > notes.md
          import json; r = json.load(open('release-meta/release.json')); c = r['changes']
          print(f"Complete, signed MacGuard rule set: {r['files']} files, {r['yara_rules']} YARA rules, package {r['package_bytes']} bytes (SHA-256 {r['package_sha256']}).")
          print(f"\nChanges since the previous release: {c['added']} added, {c['modified']} modified, {c['removed']} removed. This release installs on its own; you do not need earlier ones.")
          print("\nSigned keylessly with Sigstore (GitHub OIDC). `inclusion-proof.json` ties the rules root to the transparency log; `consistency.json` links it to the previous log head. Releases are never edited: a correction is a new release.")
          PY
          gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md \
            rules-release.tar.gz dist/manifest.json dist/manifest.sigstore.json dist/inclusion-proof.json \
            dist/checkpoint.txt dist/checkpoint.sigstore.json release-meta/release.json release-meta/changes.json release-meta/CHANGELOG.md
          if [ -f release-meta/consistency.json ]; then gh release upload "$TAG" release-meta/consistency.json; fi
          # every expected asset must be attached before the release is published
          GOT=$(gh release view "$TAG" --json assets --jq '.assets|length')
          [ "$GOT" -ge 9 ] || { echo "only $GOT assets attached"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
      - name: Tell the quarantine service which approved rules were released
        if: success()
        run: python3 scripts/quarantine_client.py released --tag "$TAG" --hashes-file dist/candidate.json --run-url "$RUN_URL"
      - name: Record result and commit the log
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            python3 scripts/tlog.py event --level INFO --code release.published --run-id "$RUN_ID" \
              --message "Signed release $TAG published on GitHub. The site deployment was requested." --detail "run_url=$RUN_URL"
          else
            python3 scripts/tlog.py event --level ERROR --code release.failed --run-id "$RUN_ID" \
              --message "Signing or publishing the release failed. Nothing new was published. See $RUN_URL" --detail "run_url=$RUN_URL"
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "publish run ${{ github.run_id }}"
      - name: Deploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml
