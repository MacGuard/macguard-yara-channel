name: Sign and publish approved candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful daily review workflow run ID'
        required: true
permissions:
  contents: write
  actions: write    # dispatch the site deployment
  id-token: write   # keyless Sigstore signing with the workflow identity
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: stable-signing
    timeout-minutes: 15
    env:
      RUN_ID: ${{ inputs.candidate_run_id }}
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ inputs.candidate_run_id }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: dist/
      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_run.py
      - name: Verify the existing log before extending it
        run: python3 scripts/tlog.py verify --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY"
      - name: Record approval and sign the log head
        run: |
          python3 scripts/tlog.py event --level INFO --code release.approved --run-id "$RUN_ID" \
            --message "Candidate from review run $RUN_ID was approved for signing in workflow run ${{ github.run_id }}." --detail "run_url=$RUN_URL"
          python3 scripts/tlog.py checkpoint
          LATEST="$(ls logs/checkpoints/*.txt | sort | tail -1)"
          cosign sign-blob --yes --bundle "${LATEST%.txt}.sigstore.json" "$LATEST"
          cp "${LATEST%.txt}.sigstore.json" logs/checkpoint.sigstore.json
          python3 scripts/tlog.py render
          python3 scripts/tlog.py verify --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY"
      - name: Write and sign the manifest
        run: |
          python3 scripts/seal.py
          cosign sign-blob --yes --bundle dist/manifest.sigstore.json dist/manifest.json
          python3 scripts/tlog.py release-proof --run-id "$RUN_ID" --manifest dist/manifest.json --out dist/inclusion-proof.json
      - name: Archive signed release
        run: tar -czf rules-release.tar.gz -C dist rules manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="rules-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          gh release create "$TAG" rules-release.tar.gz dist/manifest.json dist/manifest.sigstore.json dist/inclusion-proof.json --title "$TAG" --notes 'Approved MacGuard rules snapshot. Signed keylessly with Sigstore; inclusion-proof.json ties the rules root to the transparency log.'
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Record result and commit the log
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            python3 scripts/tlog.py event --level INFO --code release.published --run-id "$RUN_ID" \
              --message "Signed release $TAG published on GitHub. The site deployment was requested." --detail "run_url=$RUN_URL"
          else
            python3 scripts/tlog.py event --level ERROR --code release.failed --run-id "$RUN_ID" \
              --message "Signing or publishing the release failed. Nothing new was published. See $RUN_URL" --detail "run_url=$RUN_URL"
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "publish run ${{ github.run_id }}"
      - name: Deploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml
