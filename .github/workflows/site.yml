name: Deploy site to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml', 'scripts/build_site.py']
  workflow_dispatch:
permissions:
  contents: write   # append-only commit of logs/ only
  actions: read
concurrency:
  group: macguard-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --dir release --pattern 'rules-release.tar.gz' --pattern 'manifest.json' --pattern 'manifest.sig' \
            || echo 'No release found; the site will contain the web only'
      - name: Assemble site
        run: python3 scripts/build_site.py
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.missing != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macguard-rules --branch=main
      - name: Record result in transparency log
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.missing }}" = "true" ]; then
            python3 scripts/tlog.py event --level WARNING --code site.skipped --run-id "${{ github.run_id }}" \
              --message "Site deployment skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured as a repository secret. See $RUN_URL"
          elif [ "${{ steps.deploy.outcome }}" = "success" ]; then
            python3 scripts/tlog.py event --level INFO --code site.deployed --run-id "${{ github.run_id }}" \
              --message "Site deployed to Cloudflare Pages project macguard-rules. See $RUN_URL"
          else
            python3 scripts/tlog.py event --level ERROR --code site.deploy_failed --run-id "${{ github.run_id }}" \
              --message "Deploying the site to Cloudflare Pages failed (step outcome: ${{ steps.deploy.outcome }}). The previous site stays online. See $RUN_URL"
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "site deploy ${{ github.run_id }}"
