name: Deploy site (GitHub Pages and Cloudflare Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml', 'scripts/build_site.py']
  workflow_dispatch:
permissions:
  contents: read
# One writer at a time for logs/: every workflow that appends to the log shares this group.
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Fetch latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --repo "$GITHUB_REPOSITORY" --dir release --pattern 'rules-release.tar.gz' --pattern 'manifest.json' --pattern 'manifest.sigstore.json' --pattern 'inclusion-proof.json' \
            || echo 'No release found; the site will contain the web only'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Assemble site
        run: python3 scripts/build_site.py
      - name: Verify the release exactly as a client would
        run: |
          if [ -f site/manifest.json ]; then
            python3 scripts/verify_release.py site \
              --identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo 'No release yet; nothing to verify'
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dir
          path: site
          retention-days: 1

  github-pages:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read     # no write token reaches the third-party deploy action
    outputs:
      credentials: ${{ steps.creds.outputs.status }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dir
          path: site
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cf_preflight.sh
            config/cloudflare_account_id.txt
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "status=missing" >> "$GITHUB_OUTPUT"; exit 0; fi
          if bash scripts/cf_preflight.sh; then echo "status=present" >> "$GITHUB_OUTPUT"; else echo "status=invalid" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.status == 'present'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: pages deploy site --project-name=macguard-rules --branch=main

  record:
    needs: [build, github-pages, cloudflare-pages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write    # append-only commit of logs/ only; holds no Cloudflare secret
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD: ${{ needs.build.result }}
      GHPAGES: ${{ needs.github-pages.result }}
      CF: ${{ needs.cloudflare-pages.result }}
      CF_CREDENTIALS: ${{ needs.cloudflare-pages.outputs.credentials }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Record result in transparency log
        run: |
          RUN="${{ github.run_id }}"
          ev() { python3 scripts/tlog.py event --run-id "$RUN" "$@"; }
          if [ "$BUILD" != "success" ]; then
            ev --level ERROR --code site.build_failed --message "Assembling the site failed (build job: $BUILD). Nothing was deployed. See $RUN_URL"
          else
            if [ "$GHPAGES" = "success" ]; then
              ev --level INFO --code site.github_pages_deployed --message "Site deployed to GitHub Pages. See $RUN_URL"
            else
              ev --level ERROR --code site.github_pages_failed --message "Deploying the site to GitHub Pages failed (job: $GHPAGES). The previous GitHub Pages site stays online. See $RUN_URL"
            fi
            if [ "$CF_CREDENTIALS" = "missing" ]; then
              ev --level WARNING --code site.cloudflare_skipped --message "Cloudflare Pages deployment skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured as a repository secret. See $RUN_URL"
            elif [ "$CF_CREDENTIALS" = "invalid" ]; then
              ev --level ERROR --code site.cloudflare_blocked --message "Cloudflare Pages BLOCKED: the credential preflight failed (format, account id, validity or permission; see the cf-preflight line in the job log). No deploy was attempted. See $RUN_URL"
            elif [ "$CF" = "success" ]; then
              ev --level INFO --code site.cloudflare_deployed --message "Site deployed to Cloudflare Pages project macguard-rules. See $RUN_URL"
            else
              ev --level ERROR --code site.cloudflare_failed --message "Deploying the site to Cloudflare Pages failed (job: $CF). The previous Cloudflare site stays online. See $RUN_URL"
            fi
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "site deploy $RUN"
