name: Deploy site to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/site.yml', 'scripts/build_site.py']
  workflow_dispatch:
permissions:
  contents: read
# One writer at a time for logs/: every workflow that appends to the log shares this group.
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read     # no write token reaches the third-party deploy action
      actions: read
    outputs:
      credentials: ${{ steps.creds.outputs.status }}
      deployed: ${{ steps.deploy.outcome }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Fetch latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --repo "$GITHUB_REPOSITORY" --dir release --pattern 'rules-release.tar.gz' --pattern 'manifest.json' --pattern 'manifest.sig' \
            || echo 'No release found; the site will contain the web only'
      - name: Assemble site
        run: python3 scripts/build_site.py
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "status=missing" >> "$GITHUB_OUTPUT"; else echo "status=present" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.status == 'present'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=macguard-rules --branch=main

  record:
    needs: deploy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write    # append-only commit of logs/ only; holds no Cloudflare secret
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CREDENTIALS: ${{ needs.deploy.outputs.credentials }}
      DEPLOYED: ${{ needs.deploy.outputs.deployed }}
      DEPLOY_JOB: ${{ needs.deploy.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Record result in transparency log
        run: |
          RUN="${{ github.run_id }}"
          if [ "$CREDENTIALS" = "missing" ]; then
            python3 scripts/tlog.py event --level WARNING --code site.skipped --run-id "$RUN" \
              --message "Site deployment skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured as a repository secret. See $RUN_URL"
          elif [ "$DEPLOYED" = "success" ]; then
            python3 scripts/tlog.py event --level INFO --code site.deployed --run-id "$RUN" \
              --message "Site deployed to Cloudflare Pages project macguard-rules. See $RUN_URL"
          else
            python3 scripts/tlog.py event --level ERROR --code site.deploy_failed --run-id "$RUN" \
              --message "Deploying the site to Cloudflare Pages failed (deploy job: $DEPLOY_JOB, deploy step: ${DEPLOYED:-not run}). The previous site stays online. See $RUN_URL"
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "site deploy $RUN"
