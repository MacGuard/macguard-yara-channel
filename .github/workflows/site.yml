name: Deploy site (GitHub Pages and Cloudflare Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', 'docs-src/**', 'scripts/build_docs.py', 'scripts/docs_check.py', 'scripts/verify_public_release.py', 'tests/test_docs.py', 'tests/test_docs_og.py', 'scripts/og_inject.py', '.github/workflows/site.yml', 'scripts/build_site.py', 'scripts/catalog.py', 'scripts/stats.py']
  workflow_dispatch:
    inputs:
      full_visual:
        description: 'Run the full visual documentation check (40 pages, desktop and phone)'
        type: boolean
        default: false
permissions:
  contents: read
# One writer at a time for logs/: every workflow that appends to the log shares this group.
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Fetch latest signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download --repo "$GITHUB_REPOSITORY" --dir release --pattern 'rules-release.tar.gz' --pattern 'manifest.json' --pattern 'manifest.sigstore.json' --pattern 'inclusion-proof.json' \
            || echo 'No release found; the site will contain the web only'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Collect the release history and verify every manifest signature
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir history
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName'); do
            d="history/$tag"; mkdir -p "$d"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$d" --pattern manifest.json --pattern manifest.sigstore.json || { rm -rf "$d"; continue; }
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,url,assets --jq '{tag:.tagName,published_at:.publishedAt,url:.url,asset_names:[.assets[].name],package_bytes:([.assets[]|select(.name=="rules-release.tar.gz")|.size]|first)}' > "$d/meta.json"
            if cosign verify-blob --bundle "$d/manifest.sigstore.json" --certificate-identity "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$GITHUB_REPOSITORY" "$d/manifest.json" >/dev/null 2>&1; then r=valid; else r=invalid; fi
            python3 -c "import json,sys; print(json.dumps({'checked':True,'manifest_signature':sys.argv[1],'checked_by':'cosign verify-blob in the site workflow run '+sys.argv[2],'identity':sys.argv[3],'issuer':'https://token.actions.githubusercontent.com','scope':'manifest signature and identity only; file hashes and the log are checked for the latest release'}))" "$r" "$RUN_URL" "$IDENTITY" > "$d/verification.json"
          done
          ls history
      - name: Assemble site
        run: |
          python3 scripts/build_site.py
          python3 scripts/og_inject.py site "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: Verify the release exactly as a client would
        run: |
          if [ -f site/manifest.json ]; then
            python3 scripts/verify_release.py site \
              --identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo 'No release yet; nothing to verify'
          fi
      - name: Record what this run verified
        if: hashFiles('site/manifest.json') != ''
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          json.dump({'schema': 1, 'verified_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'run_url': run,
            'checks': ['Sigstore signature of manifest.json (cosign verify-blob, workflow identity, GitHub OIDC issuer, repository)',
                       'SHA-256 of every rule file against the manifest', 'rules_root recomputed from the file list',
                       'Sigstore signature of the log checkpoint', 'manifest log head equals the signed checkpoint', 'Merkle inclusion proof of the release entry'],
            'not_checked': ['Rekor inclusion is checked by cosign as part of verify-blob; the browser does not repeat it', 'Detection quality or safety of the rules']},
            open('site/verification.json', 'w'), indent=1)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dir
          path: site
          retention-days: 1

  # Nothing is deployed unless the documentation agrees with the code and the real release and renders on desktop and phone.
  # Changes to docs-src/ or the generator only re-run this workflow: they never start the rule review or create a release.
  docs-check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: site-dir
          path: site
      - name: Coherence tests (documentation vs code, manifests, policy, events, commands, ES/EN parity)
        env:
          DOCS_SITE: site
        run: python3 -m unittest tests.test_docs tests.test_docs_og -v
      # Quick render on every change: the 20 pages in English at 1280 px, one Chrome, every diagram compiled and drawn.
      - name: Render check, fast
        run: python3 scripts/docs_check.py --site site --mode fast --limit 180
      # Full visual run (40 pages, desktop and phone, toolbar interactions) only when a visual component changed, or when asked for.
      - name: Decide whether the full visual run is needed
        id: depth
        run: |
          full=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_visual }}" = "true" ]; then full=true; fi
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then changed="$(git diff --name-only "$before" HEAD)"; else changed=ALL; fi
          if echo "$changed" | grep -qE '^(web/docs\.(css|js)|web/style\.css|web/vendor/|docs-src/diagrams/|scripts/build_docs\.py|scripts/docs_check\.py|ALL)'; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"; echo "full visual run: $full"
      - name: Render check, full (40 pages x desktop and phone)
        if: steps.depth.outputs.full == 'true'
        run: python3 scripts/docs_check.py --site site --mode full --limit 300

  github-pages:
    needs: [build, docs-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The public URL is checked after deployment with nothing but the bytes it serves.
  verify-live:
    needs: [build, github-pages]
    if: needs.github-pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the published site
        env:
          URL: ${{ needs.github-pages.outputs.url }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/verify_live.py "$URL" --identity "$IDENTITY" --repo "$GITHUB_REPOSITORY" --external; then exit 0; fi
            echo "Attempt $attempt failed; GitHub Pages may still be propagating"; sleep 30
          done
          exit 1

  cloudflare-pages:
    needs: [build, docs-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read     # no write token reaches the third-party deploy action
    outputs:
      credentials: ${{ steps.creds.outputs.status }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cf_preflight.sh
            scripts/og_inject.py
            config/cloudflare_account_id.txt
      - uses: actions/download-artifact@v4
        with:
          name: site-dir
          path: site
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "status=missing" >> "$GITHUB_OUTPUT"; exit 0; fi
          if bash scripts/cf_preflight.sh; then echo "status=present" >> "$GITHUB_OUTPUT"; else echo "status=invalid" >> "$GITHUB_OUTPUT"; fi
      - name: Explain a blocked or missing Cloudflare credential (no deploy is attempted until it is replaced)
        if: steps.creds.outputs.status != 'present'
        run: |
          {
            echo "### Cloudflare Pages was NOT deployed (credential: ${{ steps.creds.outputs.status }})"
            echo
            echo "GitHub Pages is unaffected. To enable the automatic mirror, replace these two repository secrets (Settings, Secrets and variables, Actions):"
            echo "- \`CLOUDFLARE_API_TOKEN\`: a Custom API token created at dash.cloudflare.com, My Profile, API Tokens, with permission **Account, Cloudflare Pages, Edit** for the account in \`config/cloudflare_account_id.txt\`. A real token is about 40 characters of letters, digits, \`-\` and \`_\`."
            echo "- \`CLOUDFLARE_ACCOUNT_ID\`: the id in \`config/cloudflare_account_id.txt\`."
            echo
            echo "The preflight line above (\`cf-preflight:\`) says which check failed. Nothing else needs to change; the next run deploys by itself."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Point the share preview at the mirror's own address
        if: steps.creds.outputs.status == 'present'
        run: python3 scripts/og_inject.py site https://macguard-rules.pages.dev/
      - name: Create the Pages project if the account does not have it yet
        if: steps.creds.outputs.status == 'present'
        continue-on-error: true   # fails harmlessly when the project already exists
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: pages project create macguard-rules --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.status == 'present'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          command: pages deploy site --project-name=macguard-rules --branch=main

  record:
    needs: [build, docs-check, github-pages, cloudflare-pages, verify-live]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write    # append-only commit of logs/ only; holds no Cloudflare secret
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD: ${{ needs.build.result }}
      DOCS: ${{ needs.docs-check.result }}
      GHPAGES: ${{ needs.github-pages.result }}
      CF: ${{ needs.cloudflare-pages.result }}
      LIVE: ${{ needs.verify-live.result }}
      CF_CREDENTIALS: ${{ needs.cloudflare-pages.outputs.credentials }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Record result in transparency log
        run: |
          RUN="${{ github.run_id }}"
          ev() { python3 scripts/tlog.py event --run-id "$RUN" "$@"; }
          if [ "$BUILD" != "success" ]; then
            ev --level ERROR --code site.build_failed --message "Assembling the site failed (build job: $BUILD). Nothing was deployed. See $RUN_URL"
          elif [ "$DOCS" != "success" ]; then
            ev --level ERROR --code site.build_failed --message "The documentation checks failed (docs-check: $DOCS). Nothing was deployed; the previous site stays online. See $RUN_URL"
          else
            if [ "$GHPAGES" = "success" ]; then
              ev --level INFO --code site.github_pages_deployed --message "Site deployed to GitHub Pages. See $RUN_URL"
            else
              ev --level ERROR --code site.github_pages_failed --message "Deploying the site to GitHub Pages failed (job: $GHPAGES). The previous GitHub Pages site stays online. See $RUN_URL"
            fi
            case "$LIVE" in
              success) ev --level INFO --code site.live_verified --message "The public GitHub Pages site was downloaded and verified: signatures, every rule hash, catalog, proof and links. See $RUN_URL" ;;
              skipped) ;;
              *) ev --level ERROR --code site.live_failed --message "The public GitHub Pages site FAILED live verification ($LIVE). The workflow run is red; investigate before relying on it. See $RUN_URL" ;;
            esac
            if [ "$CF_CREDENTIALS" = "missing" ]; then
              ev --level WARNING --code site.cloudflare_skipped --message "Cloudflare Pages deployment skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured as a repository secret. See $RUN_URL"
            elif [ "$CF_CREDENTIALS" = "invalid" ]; then
              ev --level ERROR --code site.cloudflare_blocked --message "Cloudflare Pages BLOCKED: the credential preflight failed (format, account id, validity or permission; see the cf-preflight line in the job log). No deploy was attempted. See $RUN_URL"
            elif [ "$CF" = "success" ]; then
              ev --level INFO --code site.cloudflare_deployed --message "Site deployed to Cloudflare Pages project macguard-rules. See $RUN_URL"
            else
              ev --level ERROR --code site.cloudflare_failed --message "Deploying the site to Cloudflare Pages failed (job: $CF). The previous Cloudflare site stays online. See $RUN_URL"
            fi
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "site deploy $RUN"
