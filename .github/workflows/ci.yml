name: CI (pull requests)
# The checks a ruleset can require on `main`. No path filters on purpose: a required check that is skipped by a filter stays "pending" forever.
# Runs on pull requests and on demand; direct pushes of the log bot do not need it.
on:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the YARA engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yara
      # tests/test_verify_public_release.py verifies the real published release with cosign
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Python suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m unittest discover -s tests
  quarantine-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Service tests (node:sqlite shim)
        run: npm test
      - name: Service on workerd with a real D1 (GitHub faked)
        run: npm run test:runtime
  gateway-tests:
    # The backup, restore, custody and workflow-policy tests of the gateway (about 300). Until this job existed CI never ran them, which is how a broken restore path (#57) and a stale workflow assertion (#56) reached main
    # unnoticed. The tools they use are installed here so that they RUN instead of being skipped; detection is by PATH (gateway/test/tools_available.js).
    runs-on: ubuntu-24.04   # pinned (not ubuntu-latest): the apt packages below, and so the tool versions asserted, only change when this line does
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # the schema-migration and staging-rehearsal tests rebuild the DEPLOYED schema from commit 4d9b1ff (git show)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'   # the installer's default at this pin, stated explicitly
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the tools the tests use
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age sqlite3
      - name: Verify the tools (system location and expected version; a wrong or missing tool silently turns tests into skips)
        run: |
          set -eu
          # apt packages must come from the distribution (signed by it), never from a directory a pull request could add to PATH
          for t in age age-keygen sqlite3 ssh-keygen git python3; do
            p=$(command -v "$t") || { echo "::error::$t is missing"; exit 1; }
            case "$p" in /usr/bin/*) echo "$t: $p" ;; *) echo "::error::$t resolved to $p, expected /usr/bin"; exit 1 ;; esac
          done
          [ "$(age --version)" = "1.1.1" ] || { echo "::error::unexpected age version: $(age --version)"; exit 1; }
          sqlite3 --version | grep -q '^3\.45\.' || { echo "::error::unexpected sqlite3 version: $(sqlite3 --version)"; exit 1; }
          [ "$(command -v cosign)" = "$HOME/.cosign/cosign" ] || { echo "::error::cosign resolved to $(command -v cosign)"; exit 1; }
          cosign version 2>&1 | grep -q 'v3\.0\.6' || { echo "::error::unexpected cosign version"; cosign version 2>&1 | head -5; exit 1; }
          node --version | grep -q '^v24\.' || { echo "::error::unexpected node version: $(node --version)"; exit 1; }
          { echo "age $(age --version), $(sqlite3 --version | cut -d' ' -f1-2), cosign v3.0.6, $(ssh -V 2>&1), $(python3 --version), $(git --version), node $(node --version)"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gateway suite
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee "$RUNNER_TEMP/gateway.txt"
      - name: Skipped tests must not grow silently
        if: always()
        run: |
          grep -E 'ℹ (tests|pass|fail|skipped)' "$RUNNER_TEMP/gateway.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          N=$(awk '/ℹ skipped /{print $3}' "$RUNNER_TEMP/gateway.txt")
          MAX=$(tr -d '[:space:]' < test/ci-skip-ceiling.txt)
          echo '--- skipped tests:'; grep -E '^﹣' "$RUNNER_TEMP/gateway.txt" | cut -c1-160
          echo "skipped: $N (ceiling $MAX, test/ci-skip-ceiling.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$N" ] || { echo "::error::the suite did not report a skipped count"; exit 1; }
          [ "$N" -le "$MAX" ] || { echo "::error::$N tests were skipped, more than the $MAX allowed: a missing tool or missing history turns tests into silent skips"; exit 1; }
