name: CI (pull requests)
# The checks a ruleset can require on `main`. No path filters on purpose: a required check that is skipped by a filter stays "pending" forever.
# Runs on pull requests and on demand; direct pushes of the log bot do not need it.
on:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the YARA engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yara
      # tests/test_verify_public_release.py verifies the real published release with cosign
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Python suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m unittest discover -s tests
  quarantine-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: admin/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Service tests (node:sqlite shim)
        run: npm test
      - name: Service on workerd with a real D1 (GitHub faked)
        run: npm run test:runtime
