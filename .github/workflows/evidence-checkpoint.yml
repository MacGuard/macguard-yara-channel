# External anchor for the evidence log. Manual only: it does nothing until a person runs it, and it is not scheduled until the evidence branch exists and the move is authorised
# (docs/operations/EVIDENCE-MIGRATION.md). It verifies the hash chain of the evidence branch, builds the checkpoint {count, head}, signs it keyless with Sigstore (the signature and its Rekor entry live
# OUTSIDE this repository) and verifies it for this workflow's identity. It writes nothing to the repository and holds no secret.
name: evidence-checkpoint

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: evidence-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # keyless Sigstore signing with the workflow identity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: evidence
          path: evidence-wt
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the chain, build the checkpoint
        run: |
          set -eu
          node gateway/tools/evidence_chain.mjs verify --dir evidence-wt/evidence
          mkdir -p "$RUNNER_TEMP/checkpoint"
          node gateway/tools/evidence_chain.mjs checkpoint --dir evidence-wt/evidence > "$RUNNER_TEMP/checkpoint/checkpoint.json"
          cat "$RUNNER_TEMP/checkpoint/checkpoint.json"
      - name: Sign it with Sigstore keyless and verify it for the pinned identity
        run: |
          set -eu
          cd "$RUNNER_TEMP/checkpoint"
          cosign sign-blob --yes --bundle checkpoint.sigstore.json checkpoint.json
          cosign verify-blob --bundle checkpoint.sigstore.json --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/evidence-checkpoint.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com checkpoint.json
          { echo '### Evidence checkpoint'; echo; echo '```json'; cat checkpoint.json; echo '```'; echo 'Signed with Sigstore keyless; the bundle carries the Rekor inclusion proof. A durable copy outside GitHub is a separate, authorised step.'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-checkpoint
          path: ${{ runner.temp }}/checkpoint/
          retention-days: 90
          if-no-files-found: error
