name: Daily source review
# Autonomous review of the upstream rule sources. Everything about rules that are not published (names, findings, compiler output,
# culprits) stays inside this job and goes only to the private quarantine service: artifacts of a public repository are public.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'A person has looked at an unusually large change (more than 15% removed or 40% touched) and allows it'
        type: boolean
        default: false
      acceptance:
        description: 'Acceptance run: review, classify, validate and talk to the quarantine service as usual, but never request a release (request-publish is skipped even when the approved set changed)'
        type: boolean
        default: false
      urgent_policy_id:
        description: 'Urgent withdrawal: id of an ACTIVE administrative withdrawal still requested. Admin only. Runs the same gates as a normal run and builds now instead of waiting for the schedule'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: macguard-log
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # append-only commit of logs/ only
      id-token: write   # OIDC token for the private quarantine service (no stored secret)
      actions: read
    outputs:
      publishable: ${{ steps.gate.outputs.publishable }}
      changed: ${{ steps.changes.outputs.changed }}
    env:
      QUARANTINE_URL: ${{ vars.QUARANTINE_URL }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      # Urgent withdrawal: two independent checks BEFORE any gate runs. GitHub says the person who dispatched it is an admin of this repository (write access is not
      # enough), and the quarantine service says the policy exists, is ACTIVE with its withdrawal still requested and was authored by an ADMIN. It adds no way
      # around any gate: it only starts the normal chain now, and asserts after the gate that the prohibited scope really left the approved set.
      - name: Urgent withdrawal precheck (admin only, known policy, never with an acceptance run)
        if: inputs.urgent_policy_id != ''
        env:
          URGENT_POLICY_ID: ${{ inputs.urgent_policy_id }}
          ALL_INPUTS: ${{ toJSON(inputs) }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          python3 -c "import json,os,sys; sys.exit('An urgent withdrawal cannot be an acceptance run (an acceptance run never requests a release).' if json.loads(os.environ['ALL_INPUTS']).get('acceptance') in (True, 'true') else 0)"
          PERM="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          [ "$PERM" = "admin" ] || { echo 'An urgent withdrawal can only be started by an administrator of the repository.'; exit 1; }
          python3 scripts/quarantine_client.py urgent --policy-id "$URGENT_POLICY_ID" --run-url "$RUN_URL" --out "$RUNNER_TEMP/urgent-policy.json"
      - name: Install the YARA engine and record its version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq yara
          yara --version | tee engine-version.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # tests/test_verify_public_release.py verifies the real published release with cosign, so the suite cannot run without it
      # (the first scheduled run failed here: "cosign was not found").
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Unit and integration tests (log, classification, decisions, dynamic gate, quarantine service)
        run: |
          python3 -m unittest discover -s tests
          (cd admin/worker && node --test test/*.test.js)
      - name: Fetch and normalize inventory
        id: prepare
        run: python3 scripts/prepare.py
      - name: Static classification (integrity, syntax, dependencies, modules, regex cost, licences)
        id: classify
        run: |
          start=$(date +%s)
          python3 scripts/rulecheck.py --dist dist --out dist/classification.json
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Last verified policy snapshot (transport only, verified against its signature, the repository log and its age before use)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: policy-snapshot
          key: policy-snapshot-v1-none
          restore-keys: policy-snapshot-v1-
      - name: Latest release, reviewer decisions, rejections and prohibitions
        run: |
          mkdir -p previous
          if gh release download --repo "$GITHUB_REPOSITORY" --dir previous --pattern manifest.json --pattern rules-release.tar.gz; then
            tar -xzf previous/rules-release.tar.gz -C previous rules
          else echo 'No previous release'; fi
          python3 scripts/quarantine_client.py decisions --out dist/decisions.json
      - name: Dynamic gate (baseline vs candidate, isolate and quarantine culprits, re-measure)
        id: gate
        run: |
          start=$(date +%s)
          python3 scripts/dynamic_gate.py --dist dist --classification dist/classification.json --previous previous \
            --decisions dist/decisions.json --rejected dist/rejected.json --policies dist/policies.json \
            --out dist/decision.json --dynamic-out dist/dynamic.json ${{ inputs.allow_large_change && '--allow-large-change' || '' }} >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
      - name: Urgent withdrawal is effective (the prohibited scope is not in the approved set)
        if: inputs.urgent_policy_id != '' && steps.gate.outcome == 'success'
        run: python3 scripts/quarantine_client.py urgent-assert --policy "$RUNNER_TEMP/urgent-policy.json" --approved dist/approved.json
      - name: Keep the verified policy snapshot (signed, pinned in the log, cached); only from a live view accepted in this run
        if: steps.gate.outcome == 'success'
        run: |
          if H="$(python3 scripts/policy_snapshot.py stage --candidate dist/policy-snapshot.candidate.json --out policy-snapshot)"; then
            cosign sign-blob --yes --bundle policy-snapshot/policy-snapshot.sigstore.json policy-snapshot/policy-snapshot.json
            python3 scripts/tlog.py event --level INFO --code policy.snapshot --run-id "$RUN_ID" --message "A verified policy snapshot was stored (hash only)." --detail "$H" --detail "run_url=$RUN_URL"
          else echo 'No live policy view was accepted in this run: no snapshot is kept'; fi
      - name: Save the policy snapshot for the next runs
        if: steps.gate.outcome == 'success' && hashFiles('policy-snapshot/policy-snapshot.sigstore.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: policy-snapshot
          key: policy-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Send quarantined candidates to the private service
        if: always() && steps.gate.outcome == 'success'
        run: python3 scripts/quarantine_client.py submit --decision dist/decision.json --dist dist --dynamic dist/dynamic.json --run-id "$RUN_ID" --run-url "$RUN_URL"
      - name: Public candidate (approved rules and aggregate numbers only)
        id: changes
        if: steps.gate.outcome == 'success'
        run: |
          python3 scripts/make_public_candidate.py --dist dist --out dist-public --previous previous/manifest.json
          python3 scripts/changes.py --dist dist-public --previous previous/manifest.json --out dist-public/changes.json >> "$GITHUB_OUTPUT"
      - name: Record the result in the transparency log (counts only)
        if: always()
        env:
          CLASSIFY: ${{ steps.classify.outputs.seconds }}
          GATE: ${{ steps.gate.outputs.seconds }}
          ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance }}
        run: |
          if [ -f dist/decision.json ]; then
            PERF="$(python3 - <<'PY'
          import json, os
          args = [f"classify_seconds={os.environ.get('CLASSIFY', '0')}", f"gate_seconds={os.environ.get('GATE', '0')}", 'engine=' + open('engine-version.txt').read().strip().replace(' ', '_')]
          try:
              d = json.load(open('dist/dynamic.json')); c = d.get('candidate_runs') or []
              if c and c[0].get('scan'): args += [f"scan_p95_s={c[0]['scan']['wall_p95']:.4f}", f"scan_rss_peak_mb={c[0]['scan']['rss_peak_mb']:.1f}", f"compile_rss_mb={c[0]['compile']['rss_mb']:.1f}"]
          except Exception: pass
          print(' '.join('--perf ' + a for a in args))
          PY
          )"
            # shellcheck disable=SC2086
            python3 scripts/tlog.py entry-decision --dist dist --decision dist/decision.json --run-id "$RUN_ID" $PERF
            if [ "${{ steps.changes.outputs.changed }}" = "false" ]; then
              python3 scripts/tlog.py event --level INFO --code candidate.unchanged --run-id "$RUN_ID" --message "The approved rule files are identical to the latest release. No new release is created." --detail "run_url=$RUN_URL"
            elif [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
              CHANGES_MSG="The approved set differs from the latest release. A new release will be requested."
              if [ "$ACCEPTANCE" = "true" ]; then CHANGES_MSG="The approved set differs from the latest release. This was an acceptance run: no release is requested."; fi
              python3 scripts/tlog.py event --level INFO --code candidate.changes --run-id "$RUN_ID" --message "$CHANGES_MSG" --detail "run_url=$RUN_URL"
            fi
          else
            python3 scripts/tlog.py event --level ERROR --code run.failed --run-id "$RUN_ID" \
              --message "The daily review stopped before a decision was reached (prepare: ${{ steps.prepare.outcome }}, classify: ${{ steps.classify.outcome }}, gate: ${{ steps.gate.outcome }}). See $RUN_URL" --detail "run_url=$RUN_URL"
          fi
          python3 scripts/tlog.py render
          bash scripts/commit_logs.sh "daily review $RUN_ID"
      - name: Upload the public candidate
        if: steps.gate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ github.run_id }}
          path: dist-public/
          retention-days: 14

  # Functional and performance checks on a real macOS runner. Hosted macOS runners are VMs without nested virtualization
  # (see runner-probe.yml), so this is NOT an independent-VM test and is reported as such.
  macos:
    needs: review
    if: needs.review.outputs.publishable == 'true' && needs.review.outputs.changed != 'false'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ github.run_id }}
          path: dist-public/
      - name: Tools
        run: brew install autoconf automake libtool >/dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: engine-cache
        with:
          path: engine-out
          key: yara-engine-${{ hashFiles('DMGTrustAuditor/DMGTrustAuditor/Scripts/build-yara-engine.sh') }}
      - name: The engine that ships with MacGuard (the measurements below use exactly this binary)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: DMGTrustAuditor/DMGTrustAuditor/Scripts/build-yara-engine.sh engine-out
      - name: Put the shipped engine first on PATH
        run: echo "$PWD/engine-out" >> "$GITHUB_PATH"; "$PWD/engine-out/yara" --version
      - name: Previous release for the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          if gh release download --repo "$GITHUB_REPOSITORY" --dir previous --pattern manifest.json --pattern rules-release.tar.gz; then tar -xzf previous/rules-release.tar.gz -C previous rules; fi
      - name: Engine measurements on macOS (same method and thresholds as Linux)
        run: python3 scripts/dynamic_gate.py --verify-only --dist dist-public --previous previous --dynamic-out dynamic-macos.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-validation-${{ github.run_id }}
          path: dynamic-macos.json
          retention-days: 14

  # Compatibility with the MacGuard application is an EXTERNAL integration check: it reports, it never decides. A release depends on
  # the reference YARA engine measurements above and on nothing in the application, so request-publish does not wait for this job.
  app-compat:
    needs: [review, macos]
    if: needs.review.outputs.publishable == 'true' && needs.review.outputs.changed != 'false' && needs.macos.result == 'success'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ github.run_id }}
          path: dist-public/
      - name: Tools
        run: brew install xcodegen autoconf automake libtool >/dev/null
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: engine-cache
        with:
          path: engine-out
          key: yara-engine-${{ hashFiles('DMGTrustAuditor/DMGTrustAuditor/Scripts/build-yara-engine.sh') }}
      - name: The engine that ships with MacGuard
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: DMGTrustAuditor/DMGTrustAuditor/Scripts/build-yara-engine.sh engine-out
      - name: Build MacGuard and run it over the safe corpus
        run: |
          cd DMGTrustAuditor/DMGTrustAuditor && xcodegen generate >/dev/null
          ENGINE_DIR="$GITHUB_WORKSPACE/engine-out" xcodebuild -project DMGTrustAuditor.xcodeproj -scheme macguard-audit -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- SYMROOT="$PWD/../../build" build | tail -3
          cd ../.. && build/Release/macguard-audit engine-status --format json | tee engine-status.json
          python3 scripts/macguard_smoke.py build/Release/macguard-audit --rules-from "$GITHUB_WORKSPACE/dist-public" --out macguard-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: app-compat-${{ github.run_id }}
          path: |
            macguard-smoke.json
            engine-status.json
          retention-days: 14

  request-publish:
    needs: [review, macos]
    # A manual acceptance run exercises everything up to here and must never start a release; scheduled runs are unaffected (inputs is empty there).
    if: needs.review.outputs.publishable == 'true' && needs.review.outputs.changed == 'true' && needs.macos.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write    # request the publish workflow
      contents: read
    steps:
      - name: Request publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" -f candidate_run_id="${{ github.run_id }}"
