name: DMGTrustAuditor
options:
  bundleIdPrefix: com.macguard
  deploymentTarget:
    macOS: '13.0'
targets:
  DMGTrustAuditor:
    type: application
    platform: macOS
    sources: [App, Core]
    postBuildScripts:
      - name: Bundle the YARA engine
        basedOnDependencyAnalysis: false
        script: |
          ENGINE="${ENGINE_DIR:-$SRCROOT/../../build/engine}"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          if [ -f "$ENGINE/yara" ] && [ -f "$ENGINE/yarac" ] && [ -f "$ENGINE/engine-manifest.json" ]; then
            mkdir -p "$DEST" && cp -p "$ENGINE/yara" "$ENGINE/yarac" "$ENGINE/engine-manifest.json" "$DEST/"
          else
            echo "warning: no YARA engine at $ENGINE (build one with Scripts/build-yara-engine.sh); this build will report YARA as unavailable"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macguard.dmgtrustauditor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: '5.9'
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        DEVELOPMENT_TEAM: ""
        # Set your own Team ID in Xcode Signing & Capabilities or via release script.
        # Bundle ID is provisional; replace it with your registered identifier.
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
  DMGTrustAuditorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: DMGTrustAuditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
  macguard-audit:
    type: tool
    platform: macOS
    sources: [Core, CLI]
    postBuildScripts:
      - name: Bundle the YARA engine
        basedOnDependencyAnalysis: false
        script: |
          ENGINE="${ENGINE_DIR:-$SRCROOT/../../build/engine}"
          DEST="$TARGET_BUILD_DIR"
          if [ -f "$ENGINE/yara" ] && [ -f "$ENGINE/yarac" ] && [ -f "$ENGINE/engine-manifest.json" ]; then
            mkdir -p "$DEST" && cp -p "$ENGINE/yara" "$ENGINE/yarac" "$ENGINE/engine-manifest.json" "$DEST/"
          else
            echo "warning: no YARA engine at $ENGINE (build one with Scripts/build-yara-engine.sh); this build will report YARA as unavailable"
          fi
    settings:
      base:
        PRODUCT_NAME: macguard-audit
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
