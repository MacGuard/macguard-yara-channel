# Private quarantine service. Deploying it needs a Cloudflare token, a D1 database and a GitHub OAuth app: see ../README.md
name = "macguard-quarantine"
main = "src/index.js"
compatibility_date = "2026-08-01"   # the date the runtime test (test-runtime/) runs under; workerd 1.20260730 does not accept a later one
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
REPO = "MacGuard/macguard-yara-channel"
PUBLIC_URL = "https://REPLACE-WITH-ADMIN-HOSTNAME"
OIDC_AUDIENCE = "https://REPLACE-WITH-ADMIN-HOSTNAME"
PIPELINE_WORKFLOWS = "daily.yml,publish.yml"

[[d1_databases]]
binding = "DB"
database_name = "macguard-quarantine"
database_id = "REPLACE-WITH-D1-ID"

# Promoted intelligence (its own database so its volume never enters the panel's backups): scripts/intel_promote.py + scripts/intel_apply.sh load it, the Worker only reads it. Schema: migrations-intel/.
[[d1_databases]]
binding = "INTEL"
database_name = "macguard-intel"
database_id = "REPLACE-WITH-INTEL-D1-ID"
# Secrets (never in this file): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, TOKEN_ENC_KEY (32 random bytes, base64: seals the GitHub tokens in D1)   ->  wrangler secret put ...
# Custom domain (in the untracked per-environment copy): routes = [{ pattern = "<host>", custom_domain = true }]
